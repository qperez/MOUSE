openapi: 3.0.3
info:
  title: MOUSE Serial Hub API
  version: 1.0.0
  description: |
    REST API exposed by the MOUSE Flask service for serial device setup, mouse
    control, thermal/vibration haptics, and runtime status reporting.

    The application also emits a Socket.IO event named system_status with the
    current CPU percentage and serial connection state.

servers:
  - url: http://127.0.0.1:5000
    description: Local Flask server

tags:
  - name: Serial
    description: Direct serial device configuration and status
  - name: Mouse
    description: Mouse selection and speed controls
  - name: Thermal
    description: Thermal actuator state toggles and heat pulses
  - name: Vibration
    description: Haptic vibration commands
  - name: Metric
    description: Cyclomatic complexity submissions and analysis metadata

paths:
  /serial/port:
    get:
      tags: [Serial]
      summary: Get the configured serial port
      description: Returns the currently configured serial port and whether it is connected.
      operationId: getSerialPort
      responses:
        "200":
          description: Serial port status retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerialPortResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Serial]
      summary: Reconfigure the serial port
      description: Attempts to reconnect the serial device using the supplied port value.
      operationId: setSerialPort
      parameters:
        - name: port
          in: query
          required: false
          description: Serial port to use, such as COM5 or /dev/ttyACM1.
          schema:
            type: string
            example: "COM5"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SerialPortRequest"
      responses:
        "200":
          description: Serial port reconfigured successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerialPortResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /thermal/on:
    get:
      tags: [Thermal]
      summary: Trigger a thermal pulse on the hardware
      description: Sends a heat command to the serial device with a duration and PWM intensity.
      operationId: thermalPulse
      parameters:
        - name: duration
          in: query
          required: true
          description: Heating duration in milliseconds or device-specific units used by the serial layer.
          schema:
            type: integer
            example: 200
        - name: pwm
          in: query
          required: true
          description: PWM value for the thermal output. Must be between 0 and 255.
          schema:
            type: integer
            minimum: 0
            maximum: 255
            example: 120
      responses:
        "200":
          description: Thermal output triggered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /thermal/gui:
    get:
      tags: [Thermal]
      summary: Enable or disable GUI thermal state
      description: When start=1, GUI mode is enabled and IDE mode is disabled. When start=0, GUI mode is disabled.
      operationId: setThermalGui
      parameters:
        - name: start
          in: query
          required: true
          description: 1 to enable GUI mode, 0 to disable it.
          schema:
            type: integer
            enum: [0, 1]
            example: 1
      responses:
        "200":
          description: GUI thermal state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateToggleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /thermal/ide:
    get:
      tags: [Thermal]
      summary: Enable or disable IDE thermal state
      description: When start=1, IDE mode is enabled and GUI mode is disabled. When start=0, IDE mode is disabled.
      operationId: setThermalIde
      parameters:
        - name: start
          in: query
          required: true
          description: 1 to enable IDE mode, 0 to disable it.
          schema:
            type: integer
            enum: [0, 1]
            example: 1
      responses:
        "200":
          description: IDE thermal state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateToggleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /mouse/names:
    get:
      tags: [Mouse]
      summary: List detected mouse devices
      description: Returns a list of mouse names available through the host OS input interfaces.
      operationId: getMouseNames
      responses:
        "200":
          description: Mouse names retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MouseNamesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /mouse/set-name:
    get:
      tags: [Mouse]
      summary: Select the active mouse by name
      description: Resolves the matching device ID and sets the active mouse input.
      operationId: setMouseName
      parameters:
        - name: mouse-name
          in: query
          required: true
          description: Mouse name as returned by /mouse/names.
          schema:
            type: string
            example: "Logitech G502"
      responses:
        "200":
          description: Mouse selected successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MouseSelectionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /mouse/speed:
    get:
      tags: [Mouse]
      summary: Set speed or toggle speed management
      description: Use either the value parameter for a direct speed value or the start parameter to enable/disable speed processing. These modes are mutually exclusive.
      operationId: setMouseSpeed
      parameters:
        - name: value
          in: query
          required: false
          description: Direct mouse speed value to apply.
          schema:
            type: number
            format: float
            example: 1.5
        - name: start
          in: query
          required: false
          description: 1 enables speed management; 0 disables it.
          schema:
            type: integer
            enum: [0, 1]
            example: 1
      responses:
        "200":
          description: Mouse speed operation completed successfully
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MouseSpeedToggleResponse"
                  - $ref: "#/components/schemas/MouseSpeedValueResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /metric/complexity:
    post:
      tags: [Metric]
      summary: Submit a cyclomatic complexity report
      description: >
        Endpoint called (e.g. from an IDE plugin) to submit the cyclomatic
        complexity of a method.


        **Side effects (automatically applied):**

        - GUI thermal mode is **disabled**.

        - IDE thermal mode is **enabled**.


        **PWM haptic feedback** is derived from McCabe's risk thresholds:

        | Complexity | Risk level            | `pwm_value_erm` | `pwm_nb_pulse_erm` |
        |------------|-----------------------|-----------------|--------------------|
        | 1 – 5      | Simple, low risk      | 30              | 1                  |
        | 6 – 10     | Moderate complexity   | 50              | 2                  |
        | 11 – 20    | High, consider refactoring | 70         | 3                  |
        | 21 +       | Very high, untestable | 90              | 3                  |
      operationId: receiveComplexity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplexityPayload"
            example:
              uri: "file:///home/user/project/src/MyClass.java"
              className: "MyClass"
              methodName: "processData"
              signature: "void processData(String input)"
              complexity: 7
              startLine: 42
      responses:
        "200":
          description: Complexity metric accepted and processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplexityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /vibration/on:
    get:
      tags: [Vibration]
      summary: Trigger a single vibration pulse
      description: Sends a vibration command with a duration and PWM intensity.
      operationId: vibrationPulse
      parameters:
        - name: duration
          in: query
          required: true
          description: Vibration duration in milliseconds or device-specific units used by the serial layer.
          schema:
            type: integer
            example: 150
        - name: pwm
          in: query
          required: true
          description: PWM intensity for the vibration output. Must be between 0 and 255.
          schema:
            type: integer
            minimum: 0
            maximum: 255
            example: 80
      responses:
        "200":
          description: Vibration command sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VibrationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /vibration/loop:
    get:
      tags: [Vibration]
      summary: Trigger repeated vibration pulses
      description: Sends a vibration loop with repetition timing parameters.
      operationId: vibrationLoop
      parameters:
        - name: vibration-duration
          in: query
          required: true
          description: Duration of each vibration pulse.
          schema:
            type: integer
            example: 200
        - name: pwm
          in: query
          required: true
          description: PWM intensity for each pulse. Must be between 0 and 255.
          schema:
            type: integer
            minimum: 0
            maximum: 255
            example: 100
        - name: nb-repetitions
          in: query
          required: true
          description: Number of repetitions in the loop.
          schema:
            type: integer
            example: 3
        - name: time-between-vibration
          in: query
          required: true
          description: Delay between vibration pulses.
          schema:
            type: integer
            example: 50
      responses:
        "200":
          description: Vibration loop sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VibrationLoopResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  schemas:
    SerialPortRequest:
      type: object
      required: [port]
      properties:
        port:
          type: string
          description: Serial port to connect to.
          example: "COM5"

    SerialPortResponse:
      type: object
      required: [status, port, serial_connected]
      properties:
        status:
          type: string
          example: ok
        port:
          type: string
          nullable: true
          example: "COM5"
        serial_connected:
          type: boolean
          example: true

    HeatResponse:
      type: object
      required: [status, action, duration, pwm]
      properties:
        status:
          type: string
          example: ok
        action:
          type: string
          example: heat
        duration:
          type: integer
          example: 200
        pwm:
          type: integer
          minimum: 0
          maximum: 255
          example: 120

    StateToggleResponse:
      type: object
      required: [status, action, start]
      properties:
        status:
          type: string
          example: ok
        action:
          type: string
          example: start
        start:
          type: integer
          enum: [0, 1]
          example: 1

    MouseNamesResponse:
      type: object
      required: [status, mouse_names]
      properties:
        status:
          type: string
          example: ok
        mouse_names:
          type: array
          items:
            type: string
          example: ["Logitech G502", "USB Optical Mouse"]

    MouseSelectionResponse:
      type: object
      required: [status, mouse_name, mouse_id]
      properties:
        status:
          type: string
          example: ok
        mouse_name:
          type: string
          example: "Logitech G502"
        mouse_id:
          type: integer
          example: 8

    MouseSpeedToggleResponse:
      type: object
      required: [status, action, start]
      properties:
        status:
          type: string
          example: ok
        action:
          type: string
          example: start
        start:
          type: integer
          enum: [0, 1]
          example: 1

    MouseSpeedValueResponse:
      type: object
      required: [status, value]
      properties:
        status:
          type: string
          example: ok
        value:
          type: number
          format: float
          example: 1.5

    ComplexityPayload:
      type: object
      required: [uri, className, methodName, signature, complexity, startLine]
      properties:
        uri:
          type: string
          description: Source file URI for the method under analysis.
          example: "file:///home/user/project/src/MyClass.java"
        className:
          type: string
          description: Class containing the method.
          example: "MyClass"
        methodName:
          type: string
          description: Name of the analyzed method.
          example: "processData"
        signature:
          type: string
          description: Full method signature.
          example: "void processData(String input)"
        complexity:
          type: integer
          description: >
            Cyclomatic complexity value (McCabe). Drives the haptic PWM output:
            ≤5 → pwm 30 / 1 pulse, 6-10 → pwm 50 / 2 pulses,
            11-20 → pwm 70 / 3 pulses, 21+ → pwm 90 / 3 pulses.
          example: 7
        startLine:
          type: integer
          description: Start line of the method in the source file.
          example: 42

    ComplexityResponse:
      type: object
      required: [status, received]
      properties:
        status:
          type: string
          example: ok
        received:
          $ref: "#/components/schemas/ComplexityPayload"

    VibrationResponse:
      type: object
      required: [status, action, duration, pwm]
      properties:
        status:
          type: string
          example: ok
        action:
          type: string
          example: vibration on
        duration:
          type: integer
          example: 150
        pwm:
          type: integer
          minimum: 0
          maximum: 255
          example: 80

    VibrationLoopResponse:
      type: object
      required: [status, action, vibration_duration, pwm, nb_repetitions, time_between_vibration]
      properties:
        status:
          type: string
          example: ok
        action:
          type: string
          example: vibration on
        vibration_duration:
          type: integer
          example: 200
        pwm:
          type: integer
          minimum: 0
          maximum: 255
          example: 100
        nb_repetitions:
          type: integer
          example: 3
        time_between_vibration:
          type: integer
          example: 50

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Missing value

  responses:
    BadRequest:
      description: Invalid request or invalid query parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"