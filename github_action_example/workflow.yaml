name: GitHub to MOUSE demo
on: [push]
jobs:
  DEMO-MOUSE-mqtt:
    runs-on: ubuntu-latest
    steps:
      - name: Stress CPU
        id: stress
        run: |
          sudo apt-get install -y stress
          stress --cpu 2 --timeout 10s &

          cpu_stat() { awk '/^cpu /{t=0; for(i=2;i<=NF;i++) t+=$i; print t, $5}' /proc/stat; }

          sleep 3
          read -r t1 i1 < <(cpu_stat)
          sleep 5
          read -r t2 i2 < <(cpu_stat)

          PWM=$(awk -v t1="$t1" -v i1="$i1" -v t2="$t2" -v i2="$i2" \
            'BEGIN { u = 1 - (i2 - i1) / (t2 - t1); printf "%d", u * 255 }')
          echo "pwm2=$PWM" >> "$GITHUB_OUTPUT"
          wait
        
      - name: Get CPU load
        id: cpu
        run: |
          LOAD=$(cat /proc/loadavg | awk '{print $1}')
          CORES=$(nproc)
          PWM=$(awk -v l="$LOAD" -v c="$CORES" 'BEGIN { v = l / c * 255; if (v > 255) v = 255; printf "%d", v }')
          echo "load=$LOAD" >> $GITHUB_OUTPUT
          echo "pwm=$PWM" >> "$GITHUB_OUTPUT"

      - name: MQTT Publish Action
        uses: juhrlass/mqtt-action@1.2.0
        with:
          protocol: mqtt
          host: test.mosquitto.org  # Change with your MQTT broker adress
          port: 1883
          topic: "MOUSE_mqtt_bridge"
          message: '{"thermal": "on", "pwm_duration_thermal": 10000, "pwm_value_thermal": ${{ steps.stress.outputs.pwm2 }}}' 
          # vibration or mouse speed can also be triggered (or combination of the three modalities) :
          # message: '{"vibration": "on", pwm_duration_erm": 300, "pwm_value_erm": "${{ steps.cpu.outputs.load }}"}'
          # message: '{"mouse_speed": "on", mouse_speed_factor": X, "mouse_speed_duration": Y}'